<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name" >Card-name<span aria-hidden="true">*</span></label>
            <input type="text" id="card-name" name="card-name" required>
            <label for="card-number">Card-number<span aria-hidden="true">*</span></label>
            <input type="text" name="card-number" id="card-number" aria-describedby="card-number-help" required>
            <p id="card-number-help">e.g.xxxx-xxx-xxxx</p>
        </form>
    </section>
    


</body>

</html>
